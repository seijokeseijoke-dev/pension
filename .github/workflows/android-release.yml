# Bygger en signerad Android App Bundle (.aab) för Google Play.
# Startas manuellt (Actions → "Bygg Android-app" → Run workflow) eller när en tagg v* pushas.
name: Bygg Android-app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installera beroenden
        run: npm ci

      - name: Kör skattetester
        run: node test.js

      - name: Bygg webbdelen och synka till Android
        run: |
          python3 build.py
          npx cap sync android

      - name: Hämta uppladdningsnyckeln
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Hemligheten ANDROID_KEYSTORE_BASE64 saknas. Bygger en osignerad test-APK i stället (kan inte laddas upp i Google Play) – se README."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 är inte giltig base64 – skapa upload.b64 igen enligt README"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Bygg signerad App Bundle (för Google Play)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="$VERSION"

      - name: Ladda upp App Bundle
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: pension-efter-skatt-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Bygg test-APK (att installera direkt på telefonen)
        working-directory: android
        run: |
          VERSION=$(node -p "require('../package.json').version")
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="$VERSION"

      - name: Ladda upp test-APK
        uses: actions/upload-artifact@v5
        with:
          name: pension-efter-skatt-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
